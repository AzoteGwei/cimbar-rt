name: ci

on: [push, pull_request]

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: true
      matrix:
        config:
        - name: "linux gcc11"
          os: ubuntu-22.04
          env: CXX="g++-11" CC="gcc-11"

        - name: "linux gcc-latest"
          os: ubuntu-latest

        - name: "linux clang14"
          os: ubuntu-22.04
          env: CXX="clang++" CC="clang"
          extra-packages: "clang"

        - name: "linux clang-latest"
          os: ubuntu-latest
          env: CXX="clang++" CC="clang"
          extra-packages: "clang"

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ matrix.config.os }}-${{ matrix.config.name }}-${{ hashFiles('meson.build', 'meson_options.txt', 'src/**/*.cpp', 'src/**/*.h', 'src/**/*.hpp') }}
        restore-keys: |
          ccache-${{ matrix.config.os }}-${{ matrix.config.name }}-
          ccache-${{ matrix.config.os }}-

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install ccache libopencv-dev libglfw3-dev libgles2-mesa-dev meson ninja-build ${{ matrix.config.extra-packages }}

    - name: Configure ccache
      run: ccache --max-size=500M

    - name: Configure Meson
      run: ${{ matrix.config.env }} meson setup build --prefix ${{ github.workspace }}/dist

    - name: Build
      run: ninja -C build && meson install -C build

    - name: Test
      run: meson test -C build --suite libcimbar --verbose

    - name: Usage test
      working-directory: ${{runner.workspace}}/libcimbar/test/py
      run: python3 -m unittest

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: libcimbar-${{ matrix.config.name }}-${{ github.sha }}
        path: ${{ github.workspace }}/dist/
        retention-days: 30

  cppcheck:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt-get install cppcheck

    - name: run cppcheck
      run: cppcheck src/ tools/

  fuzz:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install libopencv-dev libglfw3-dev libgles2-mesa-dev meson ninja-build clang

    - name: Configure Meson with fuzz targets
      run: CXX="clang++" CC="clang" meson setup build-fuzz -Dfuzz=true --prefix ${{ github.workspace }}/dist

    - name: Build fuzz targets
      run: ninja -C build-fuzz cimbar_fuzz_decode cimbar_fuzz_fountain cimbar_fuzz_encode

    - name: Run fuzz targets
      run: |
        ASAN_OPTIONS=alloc_dealloc_mismatch=0 \
        timeout 30 ./build-fuzz/cimbar_fuzz_decode -runs=10000 fuzz/corpus/ 2>&1 | tail -3
        ASAN_OPTIONS=alloc_dealloc_mismatch=0 \
        timeout 30 ./build-fuzz/cimbar_fuzz_encode -runs=10000 fuzz/corpus/ 2>&1 | tail -3
        ASAN_OPTIONS=alloc_dealloc_mismatch=0 \
        timeout 30 ./build-fuzz/cimbar_fuzz_fountain -runs=10000 fuzz/corpus/ 2>&1 | tail -3

